name: Test (macOS / Linux)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check JS files
        run: |
          for f in lib/ansi.js lib/config-win.js lib/history-key.js lib/agent-resolver.js \
                   lib/safe-rm.js lib/run.js lib/render.js lib/context.js lib/shellish-cmd.js; do
            node --check "$f" || (echo "SYNTAX ERROR: $f" && exit 1)
          done
          echo "All JS files syntax OK"

      - name: Test agent resolution
        run: node scripts/test-agent-resolution.js

      - name: Test history key (no collisions)
        run: |
          node <<'NODE'
          const { safeHistoryKey } = require('./lib/history-key');
          const a = safeHistoryKey('C:\\Users\\foo\\Projects\\app');
          const b = safeHistoryKey('D:\\Users\\foo\\Projects\\app');
          if (a === b) { console.error('collision:', a); process.exit(1); }
          console.log('history key OK');
          NODE

      - name: Test config win (UTF-16LE round-trip)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const tmp = path.join(os.tmpdir(), 'shellish-cfg-' + Date.now() + '.txt');
          // Write UTF-16LE BOM + content
          const buf = Buffer.concat([Buffer.from([0xff, 0xfe]), Buffer.from('agent=codex\n', 'utf16le')]);
          fs.writeFileSync(tmp, buf);
          process.env.SHELLISH_CONFIG_FILE = tmp;
          const cfg = require('./lib/config-win');
          const got = cfg.get('agent');
          if (got !== 'codex') { console.error('expected codex, got', got); process.exit(1); }
          console.log('UTF-16LE config OK:', got);
          fs.unlinkSync(tmp);
          NODE

      - name: Test bash entrypoint
        run: |
          bash -n install.sh
          chmod +x bin/shellish bin/shellish-trash bin/shellish-rm
          ./bin/shellish version | grep -q "shellish v" || (echo "shellish bash failed" && exit 1)
          bash -n bin/shellish-trash
          bash -n bin/shellish-rm
          echo "bash entrypoint OK"

      - name: Test safe-rm flag stripping and -f semantics
        run: |
          bash -n lib/safe-rm.sh
          TMP=$(mktemp -d)
          mkdir -p "$TMP/fake-bin"
          # fake trash backend records argv; rejects rm-style flags like the real ones
          cat > "$TMP/fake-bin/trash" <<'EOF'
          #!/usr/bin/env bash
          for a in "$@"; do
            case "$a" in -*) echo "unexpected flag: $a" >&2; exit 2;; esac
          done
          printf '%s\n' "$@" >> "${TRASH_LOG:?}"
          for t in "$@"; do /bin/rm -rf -- "$t"; done
          EOF
          chmod +x "$TMP/fake-bin/trash"
          export TRASH_LOG="$TMP/args.log"

          mkdir -p "$TMP/a/.venv" "$TMP/b/.venv"
          touch "$TMP/a/.venv/x" "$TMP/b/.venv/y"
          ( cd "$TMP" && PATH="$TMP/fake-bin:$PATH" SHELLISH_CONFIRM_DANGER=allow \
              bash "$GITHUB_WORKSPACE/lib/safe-rm.sh" -rf a/.venv b/.venv )
          test ! -e "$TMP/a/.venv" || (echo "a/.venv survived" && exit 1)
          test ! -e "$TMP/b/.venv" || (echo "b/.venv survived" && exit 1)

          # -f missing → 0; without -f → 1
          PATH="$TMP/fake-bin:$PATH" SHELLISH_CONFIRM_DANGER=allow \
            bash lib/safe-rm.sh -f "$TMP/nope" || (echo "-f missing should exit 0" && exit 1)
          if PATH="$TMP/fake-bin:$PATH" SHELLISH_CONFIRM_DANGER=allow \
            bash lib/safe-rm.sh "$TMP/nope" 2>/dev/null; then
            echo "missing without -f should exit 1"; exit 1
          fi

          # parseRmArgs unit (shared logic for safe-rm.js)
          node -e "
            const { parseRmArgs } = require('./lib/safe-rm.js');
            const eq = (g, w) => JSON.stringify(g) === JSON.stringify(w);
            if (!eq(parseRmArgs(['-rf','a','b']), {targets:['a','b'],force:true})) process.exit(1);
            if (!eq(parseRmArgs(['--','-rf']), {targets:['-rf'],force:false})) process.exit(1);
          "
          echo "safe-rm OK"
